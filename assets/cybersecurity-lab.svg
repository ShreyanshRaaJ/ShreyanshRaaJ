    <text x="638" y="254" fill="#9DAAB2" font-family="Segoe UI, Arial, sans-serif" font-size="14">Packet capture and</text>
    <text x="638" y="276" fill="#9DAAB2" font-family="Segoe UI, Arial, sans-serif" font-size="14">protocol inspection</text>
    <path d="M638 316h62" stroke="#00E5FF" stroke-width="3"/>
