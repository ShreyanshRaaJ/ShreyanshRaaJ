    <text x="926" y="254" fill="#9DAAB2" font-family="Segoe UI, Arial, sans-serif" font-size="14">Network topology</text>
    <text x="926" y="276" fill="#9DAAB2" font-family="Segoe UI, Arial, sans-serif" font-size="14">building and simulation</text>
    <path d="M926 316h62" stroke="#39FF88" stroke-width="3"/>
    <text x="926" y="343" fill="#6F858E" font-family="Consolas, 'Courier New', monospace" font-size="12">NETWORK LAB</text>
